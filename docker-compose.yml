name: climbing-companion

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: climbing-companion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: climb
      POSTGRES_PASSWORD: climbing_dev_password
      POSTGRES_DB: climbing_companion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: climbing-companion_pgdata
