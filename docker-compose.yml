services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: climb-companion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: climb
      POSTGRES_PASSWORD: climb_dev_password
      POSTGRES_DB: climb_companion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: